<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 366" role="img" aria-label="kilele">
  <!--
    Kilele evergreen wordmark — "H · Downcomer", chosen in issue #137.
    NOT WIRED IN ANYWHERE YET: #140 decides how the prototype layer
    coexists with the live site, so this file ships nothing today.

    Colour comes from three custom properties, defaulted below to the
    cream colourway. INLINE this file (not <img src>) and override them
    for the other three contexts:
      ink ground   --m-ink #f2eee2  --m-red #c74240  --m-ground #0f0f0e
      one colour   --m-red = --m-ink
    --m-ground is load-bearing, not cosmetic: it paints the knockout
    halo behind the type that keeps a clean gap where a pipe passes
    behind a letter. On a transparent or photographic ground that gap
    collapses and the crossing turns to mush.

    Type is live Archivo Black, so this still depends on the webfont.
    Convert to outlines before it is used as a real logo asset.

    Palette: src/css/tokens.prototype.css (#136).
    Canvas: https://claude.ai/code/artifact/4f08b447-8841-461c-807d-98a4f608def1
  -->
  <style>
    svg { --m-ink: #0f0f0e; --m-red: #b61212; --m-ground: #f2eee2; }
  </style>
  <g stroke="var(--m-red)" stroke-width="17" fill="none">
    <line x1="0" y1="116" x2="612" y2="116" stroke-linecap="butt"/>
    <g stroke-linecap="round">
      <line x1="46" y1="116" x2="46" y2="70"/>
      <line x1="84" y1="116" x2="84" y2="36"/>
      <line x1="122" y1="116" x2="122" y2="82"/>
      <line x1="214" y1="116" x2="214" y2="24"/>
      <line x1="252" y1="116" x2="252" y2="12"/>
      <line x1="290" y1="116" x2="290" y2="48"/>
      <line x1="434" y1="116" x2="434" y2="20"/>
      <line x1="540" y1="116" x2="540" y2="76"/>
      <line x1="578" y1="116" x2="578" y2="42"/>
      <line x1="84" y1="116" x2="84" y2="148"/>
      <line x1="202" y1="116" x2="202" y2="130"/>
      <line x1="252" y1="116" x2="252" y2="150"/>
      <line x1="322" y1="116" x2="322" y2="196"/>
      <line x1="360" y1="116" x2="360" y2="348"/>
      <line x1="400" y1="116" x2="400" y2="182"/>
      <line x1="464" y1="116" x2="464" y2="146"/>
      <line x1="530" y1="116" x2="530" y2="194"/>
      <line x1="578" y1="116" x2="578" y2="170"/>
    </g>
  </g>
  <circle cx="202" cy="176.25" r="19.6" fill="none" stroke="var(--m-red)" stroke-width="15.5"/>
  <g fill="var(--m-ink)" stroke="var(--m-ink)">
    <rect x="167" y="103" width="6" height="26"/>
    <rect x="497" y="103" width="6" height="26"/>
    <rect x="107" y="72" width="30" height="6"/>
    <rect x="421" y="53" width="26" height="6"/><rect x="447" y="54.5" width="16" height="3"/><circle cx="470" cy="56" r="7" fill="none" stroke-width="3.5"/>
    <rect x="609" y="100" width="7" height="32"/>
  </g>
  <g font-family="'Archivo Black','Arial Black',sans-serif" font-size="210" letter-spacing="-6"
     fill="var(--m-ink)" paint-order="stroke fill" stroke="var(--m-ground)" stroke-width="17" stroke-linejoin="round">
    <text x="330" y="326" text-anchor="middle">k&#305;lele</text>
  </g>
</svg>
