    {% set pageTitle = title or site.name %}
    {% set pageDescription = description or site.description %}
    {% set canonicalUrl = site.url ~ page.url %}
    {% set pageImage = og_image or site.defaultImage %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="/assets/logos/favicon_2026.ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!--meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';"-->
    <title>{{ pageTitle }}</title>
    <meta name="description" content="{{ pageDescription }}">
    <link rel="canonical" href="{{ canonicalUrl }}">

    <meta property="og:title" content="{{ pageTitle }}">
    <meta property="og:description" content="{{ pageDescription }}">
    <meta property="og:type" content="{{ og_type if og_type else 'website' }}">
    <meta property="og:url" content="{{ canonicalUrl }}">
    <meta property="og:image" content="{{ pageImage }}">
    <meta property="og:site_name" content="{{ site.name }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ pageTitle }}">
    <meta name="twitter:description" content="{{ pageDescription }}">
    <meta name="twitter:image" content="{{ pageImage }}">

    <script type="application/ld+json">
    {{ {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": site.name,
        "url": site.url,
        "logo": site.logo,
        "sameAs": site.sameAs
    } | dump | safe }}
    </script>

    <link rel="preload" as="image" href="/assets/logos/kilele_2026_noText.png">
    <link rel="preload" as="image" href="/assets/logos/kilele_logo_2026.png">
    <link rel="preload" as="image" href="/assets/images/2026/Kilele-2026-Banner.jpg">
    <link rel="preload" as="image" href="/assets/images/2026/Kilele-2026-Banner-NoDiver.jpg">
    <!--link rel="preload" as="image" href="/assets/backgrounds/kilele_bg_2026.png"-->
    <link rel="preload" as="image" href="/assets/backgrounds/kilele_bg_2026_horiz.png">
    
    <link rel="stylesheet" href="/css/global.css" />
