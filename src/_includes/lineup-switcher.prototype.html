{#
  PROTOTYPE — throwaway (#192). The bar at the bottom that flips between the
  variants with ?variant=A|B|C (or the arrow keys). "0" is the current page.
  Links inside a variant carry the variant along, so list and artist page stay paired.
#}
<nav class="pv-switcher" aria-label="Prototype variants">
    <button type="button" data-step="-1" aria-label="Previous variant">←</button>
    <span data-label></span>
    <button type="button" data-step="1" aria-label="Next variant">→</button>
</nav>

<script>
(function () {
    var keys = ["0", "A", "B", "C"];
    var names = { "0": "Current page", A: "Contact sheet", B: "Register", C: "Riser" };
    var real = document.querySelector("[data-pv-real]");
    var label = document.querySelector(".pv-switcher [data-label]");

    function show(key) {
        if (keys.indexOf(key) < 0) key = "0";
        real.hidden = key !== "0";
        document.querySelectorAll(".pv").forEach(function (v) { v.hidden = v.dataset.variant !== key; });
        label.textContent = key + " · " + names[key];
        var url = new URL(location.href);
        if (key === "0") url.searchParams.delete("variant"); else url.searchParams.set("variant", key);
        history.replaceState(null, "", url);
        return key;
    }

    var current = show(new URLSearchParams(location.search).get("variant") || "0");
    function step(d) { current = show(keys[(keys.indexOf(current) + d + keys.length) % keys.length]); }
    document.querySelectorAll(".pv-switcher [data-step]").forEach(function (b) {
        b.addEventListener("click", function () { step(+b.dataset.step); });
    });
    document.addEventListener("keydown", function (e) {
        if (e.target.closest("input, textarea, [contenteditable]")) return;
        if (e.key === "ArrowLeft") step(-1);
        if (e.key === "ArrowRight") step(1);
    });

    /* B · Register: the preview panel follows the row under the pointer or focus. */
    var viewer = document.querySelector("[data-pv-viewer]");
    if (viewer) {
        var img = viewer.querySelector("img");
        var cap = viewer.querySelector("[data-pv-caption]");
        document.querySelectorAll("[data-pv-photo]").forEach(function (row) {
            function preview() {
                img.src = row.dataset.pvPhoto || "";
                img.hidden = !row.dataset.pvPhoto;
                cap.textContent = row.dataset.pvCaption;
            }
            row.addEventListener("mouseenter", preview);
            row.addEventListener("focus", preview);
        });
    }
})();
</script>
