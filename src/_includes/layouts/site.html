<!DOCTYPE html>
<html lang="en">
<head>
    {% set pageTitle = title or site.name %}
    {% set pageDescription = description or site.description %}
    {% set canonicalUrl = site.url ~ page.url %}
    {% set pageImage = og_image or site.defaultImage %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap">

    <link rel="icon" type="image/x-icon" href="/assets/logos/favicon_2026.ico">

    <title>{{ pageTitle }}</title>
    <meta name="description" content="{{ pageDescription }}">
    <link rel="canonical" href="{{ canonicalUrl }}">

    <meta property="og:title" content="{{ pageTitle }}">
    <meta property="og:description" content="{{ pageDescription }}">
    <meta property="og:type" content="{{ og_type if og_type else 'website' }}">
    <meta property="og:url" content="{{ canonicalUrl }}">
    <meta property="og:image" content="{{ pageImage }}">
    <meta property="og:site_name" content="{{ site.name }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ pageTitle }}">
    <meta name="twitter:description" content="{{ pageDescription }}">
    <meta name="twitter:image" content="{{ pageImage }}">

    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <div id="swup" class="page page--{{ pageName }}">
        {{ content | safe }}
    </div>
</body>
</html>
