{#
  PROTOTYPE — throwaway (#193). The bar at the bottom that flips between the
  variants with ?variant=A|B|C (or the arrow keys). "0" is the old page.
  Links inside a variant carry the variant along, so list and point page stay
  paired. Also runs the rough category filter (buttons or select).
#}
<nav class="pv-switcher" aria-label="Prototype variants">
    <button type="button" data-step="-1" aria-label="Previous variant">←</button>
    <span data-label></span>
    <button type="button" data-step="1" aria-label="Next variant">→</button>
</nav>

<script>
(function () {
    var keys = ["0", "A", "B", "C", "D"];
    var names = { "0": "Current page", A: "Register", B: "Timesheet", C: "Board", D: "Cast" };
    var real = document.querySelector("[data-pv-real]");
    var label = document.querySelector(".pv-switcher [data-label]");

    function show(key) {
        if (keys.indexOf(key) < 0) key = "0";
        if (real) real.hidden = key !== "0";
        document.querySelectorAll(".pv").forEach(function (v) { v.hidden = v.dataset.variant.split(" ").indexOf(key) < 0; });
        // Links carry the current variant along (the list's A also stands in for D).
        if (key !== "0") document.querySelectorAll('a[href*="variant="]').forEach(function (a) {
            a.href = a.href.replace(/variant=[A-Z]/, "variant=" + key);
        });
        label.textContent = key + " · " + names[key];
        var url = new URL(location.href);
        if (key === "0") url.searchParams.delete("variant"); else url.searchParams.set("variant", key);
        history.replaceState(null, "", url);
        return key;
    }

    var current = show(new URLSearchParams(location.search).get("variant") || "0");
    function step(d) { current = show(keys[(keys.indexOf(current) + d + keys.length) % keys.length]); }
    document.querySelectorAll(".pv-switcher [data-step]").forEach(function (b) {
        b.addEventListener("click", function () { step(+b.dataset.step); });
    });
    document.addEventListener("keydown", function (e) {
        if (e.target.closest("input, textarea, select, [contenteditable]")) return;
        if (e.key === "ArrowLeft") step(-1);
        if (e.key === "ArrowRight") step(1);
    });

    // Rough category filter: hide rows of other categories, then empty days.
    function filter(variant, cat) {
        variant.querySelectorAll("li[data-category]").forEach(function (li) {
            li.hidden = cat !== "all" && li.dataset.category !== cat;
        });
        variant.querySelectorAll(".pv-day").forEach(function (day) {
            day.hidden = !day.querySelector("li[data-category]:not([hidden])");
        });
    }
    document.querySelectorAll("[data-pv-filter]").forEach(function (bar) {
        bar.addEventListener("click", function (e) {
            var b = e.target.closest("button[data-cat]");
            if (!b) return;
            bar.querySelectorAll("button").forEach(function (x) { x.classList.toggle("is-active", x === b); });
            filter(bar.closest(".pv"), b.dataset.cat);
        });
    });
    document.querySelectorAll("[data-pv-select]").forEach(function (s) {
        s.addEventListener("change", function () { filter(s.closest(".pv"), s.value); });
    });
})();
</script>
